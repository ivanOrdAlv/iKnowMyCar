<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>iKnowMyCar - OBD-II Telemetry</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="iKnowMyCar">
  <link rel="apple-touch-icon" href="icons/icon-180x180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180x180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-192x192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16x16.png">

  <!-- Microsoft -->
  <meta name="msapplication-TileColor" content="#000000">
  <meta name="msapplication-tap-highlight" content="no">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/performance.css">
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="" />
  <!-- Chart.js para gráficas -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- Barra superior -->
  <header id="app-header">
    <div class="header-left">
      <span class="app-title">iKnowMyCar</span>
    </div>
    <div class="header-right">
      <span id="connection-status" class="status-badge disconnected">
        <span class="status-dot"></span> OFFLINE
      </span>
      <button id="btn-connect" class="btn-connect" title="Conectar ELM327">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M6.5 6.5l11 11M6.5 17.5l11-11M12 2v4M12 18v4M2 12h4M18 12h4"/>
        </svg>
      </button>
      <button id="btn-vehicle" class="btn-vehicle" title="Mi vehículo">🚗</button>
      <button id="btn-performance" class="btn-performance" title="Performance">⏱️</button>
      <button id="btn-hud" class="btn-hud" title="Modo HUD">🪞</button>
      <button id="btn-settings" class="btn-settings" title="Ajustes">⚙</button>
    </div>
  </header>

  <!-- Contenido principal (SPA) -->
  <main id="app-content">
    <!-- Las vistas se renderizan aquí dinámicamente -->
  </main>

  <!-- Barra de navegación inferior -->
  <nav id="bottom-nav">
    <button class="nav-item active" data-page="dashboard">
      <span class="nav-item-icon">⦿</span>
      <span>LIVE</span>
    </button>
    <button class="nav-item" data-page="route">
      <span class="nav-item-icon">⟴</span>
      <span>TRACK</span>
    </button>
    <button class="nav-item" data-page="racing">
      <span class="nav-item-icon">⚡</span>
      <span>RACE</span>
    </button>
    <button class="nav-item" data-page="history">
      <span class="nav-item-icon">▤</span>
      <span>HISTORY</span>
    </button>
    <button class="nav-item" data-page="dtc">
      <span class="nav-item-icon">⚠</span>
      <span>ECU</span>
    </button>
  </nav>

  <!-- Modal de conexión BLE -->
  <div id="modal-connect" class="modal hidden">
    <div class="modal-content">
      <h2>CONEXIÓN OBD</h2>
      <p>Busca tu adaptador ELM327 BLE y selecciónalo.</p>
      <div id="connect-log" class="connect-log"></div>
      <div class="modal-actions">
        <button id="btn-scan" class="btn-confirm">BUSCAR DISPOSITIVO</button>
        <button id="btn-modal-close" class="btn-cancel">CANCELAR</button>
      </div>
    </div>
  </div>

  <!-- Modal de renombrar -->
  <div id="modal-rename" class="modal hidden">
    <div class="modal-content">
      <h2>RENOMBRAR SESIÓN</h2>
      <input type="text" id="rename-input" class="modal-input" placeholder="Nombre de la sesión..." />
      <div class="modal-actions" style="justify-content: flex-end;">
        <button id="btn-rename-cancel" class="btn-cancel">CANCELAR</button>
        <button id="btn-rename-confirm" class="btn-confirm">GUARDAR</button>
      </div>
    </div>
  </div>

  <!-- Modal confirmación -->
  <div id="modal-confirm" class="modal hidden">
    <div class="modal-content">
      <h2 id="confirm-title">CONFIRMAR</h2>
      <p id="confirm-message"></p>
      <div class="modal-actions" style="justify-content: flex-end;">
        <button id="btn-confirm-cancel" class="btn-cancel">CANCELAR</button>
        <button id="btn-confirm-ok" class="btn-confirm">ACEPTAR</button>
      </div>
    </div>
  </div>

  <!-- Scripts de la app -->
  <script src="js/obd-parser.js"></script>
  <script src="js/obd-manager.js"></script>
  <script src="js/fuel-estimator.js"></script>
  <script src="js/event-detector.js"></script>
  <script src="js/dtc-data.js"></script>
  <script src="js/trip-storage.js"></script>
  <script src="js/location-tracker.js"></script>
  <script src="js/settings-manager.js"></script>
  <script src="js/performance-storage.js"></script>
  <script src="js/performance-view.js"></script>
  <script src="js/hud-view.js"></script>
  <script src="js/vehicle-profile.js"></script>
  <script src="js/maintenance.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/route.js"></script>
  <script src="js/racing.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
  <script src="js/history.js"></script>
  <script src="js/dtc.js"></script>
  <script src="js/vehicle-view.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>

  <!-- Service Worker Registration + URL Params -->
  <script>
    // Registrar Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => {
            console.log('[PWA] Service Worker registrado:', reg.scope);
            // Notificar al SW cuando hay nueva versión
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[PWA] Nueva versión disponible');
                  // Aquí se podría mostrar un toast al usuario
                }
              });
            });
          })
          .catch(err => console.warn('[PWA] SW error:', err));
      });
    }

    // Soporte para shortcuts y URL params
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);

      // Abrir HUD directamente desde shortcut
      if (params.get('hud') === '1') {
        setTimeout(() => {
          if (typeof HUDView !== 'undefined') HUDView.render();
        }, 300);
        return;
      }

      // Navegar a una página específica desde shortcut
      const page = params.get('page');
      if (page && typeof App !== 'undefined') {
        setTimeout(() => App.navigateTo(page), 300);
      }
    });
  </script>
</body>
</html>
